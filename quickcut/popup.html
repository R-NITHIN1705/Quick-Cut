<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuickCut</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/quickcut.svg" alt="" width="38" height="38">
        <div><h1>QuickCut</h1><p>Your quick capture library</p></div>
      </div>
      <a class="settings" href="options.html" target="_blank" title="Open settings" aria-label="Open settings">⚙</a>
    </header>

    <section class="capture-modes" aria-label="Capture modes">
      <button id="activate" class="mode-button mode-primary" type="button">
        <span class="mode-icon" aria-hidden="true">✂</span><span><strong>Select text</strong><small>Pick a start and end point</small></span>
      </button>
      <button id="link-capture" class="mode-button mode-link" type="button">
        <span class="mode-icon link-icon" aria-hidden="true">↗</span><span><strong>Capture link</strong><small>Save a link without opening it</small></span>
      </button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section class="library" aria-label="Saved captures">
      <div class="library-heading">
        <div><h2>Your captures</h2><span id="count" class="count">Loading…</span></div>
        <button id="clear-all" class="text-button danger-text" type="button" hidden>Clear all</button>
      </div>

      <label class="search-box" for="search">
        <span aria-hidden="true" class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Search your captures…" autocomplete="off" spellcheck="false" autofocus>
        <kbd>/</kbd>
      </label>

      <div id="clear-confirm" class="confirm-bar" hidden>
        <span>Delete all saved captures?</span>
        <div><button id="cancel-clear" class="text-button" type="button">Cancel</button><button id="confirm-clear" class="confirm-delete" type="button">Delete all</button></div>
      </div>

      <div id="captures" class="capture-list" aria-live="polite"></div>
    </section>
    <footer><span>Stored on this device</span><a href="options.html" target="_blank">Settings &amp; history limit <span aria-hidden="true">↗</span></a></footer>
  </main>
  <script src="sounds/sounds.js"></script>
  <script src="popup.js"></script>
</body>
</html>
